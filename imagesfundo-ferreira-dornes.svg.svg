<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="50%" stop-color="#76c9f9"/>
      <stop offset="100%" stop-color="#2a9adf"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a1ebff"/>
      <stop offset="100%" stop-color="#009bd6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <g id="tree">
      <rect x="-8" y="0" width="16" height="48" rx="2" fill="#6b4a2a"/>
      <circle cx="0" cy="-6" r="28" fill="#0b7cc1"/>
      <circle cx="-20" cy="2" r="20" fill="#00a6d4"/>
      <circle cx="18" cy="6" r="18" fill="#0b7cc1"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="100%" height="100%" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="1550" cy="140" r="48" fill="#fff9d6" opacity="0.9"/>

  <!-- Distant hills -->
  <path d="M0,620 C280,520 560,560 860,620 C1160,680 1560,600 1920,640 L1920,1080 L0,1080 Z" fill="#d7ecf9" opacity="0.6"/>

  <!-- Shore / sand -->
  <path d="M0,700 C340,620 600,650 940,700 C1280,750 1560,720 1920,760 L1920,1080 L0,1080 Z" fill="#f3efe8" opacity="0.95"/>

  <!-- Lake -->
  <g transform="translate(0,760)">
    <path d="M0,60 C220,-20 480,10 840,20 C1200,30 1460,-10 1920,60 L1920,420 L0,420 Z" fill="url(#lakeGrad)"/>
    <path d="M0,120 C220,80 480,140 840,130 C1200,120 1460,90 1920,120" stroke="#bfeeff" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M0,160 C240,120 520,180 880,170 C1240,160 1500,140 1920,160" stroke="#e2fbff" stroke-width="4" fill="none" opacity="0.5"/>
  </g>

  <!-- Trees -->
  <use href="#tree" x="120" y="580"/>
  <use href="#tree" x="220" y="610" transform="scale(0.9)"/>
  <use href="#tree" x="320" y="590" transform="scale(0.85)"/>
  <use href="#tree" x="420" y="620" transform="scale(0.75)"/>
  <use href="#tree" x="1520" y="610" transform="scale(0.95)"/>
  <use href="#tree" x="1620" y="630" transform="scale(1.0)"/>

  <!-- House under construction -->
  <g transform="translate(980,610)" filter="url(#softShadow)">
    <rect x="-160" y="-40" width="320" height="140" rx="10" fill="#fafafa"/>
    <rect x="-120" y="-30" width="240" height="100" fill="#ffffff" stroke="#cfe9fb" stroke-width="3"/>
    <polyline points="-140,-30 0,-110 140,-30" fill="none" stroke="#0b3d91" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="-90" y1="-26" x2="-90" y2="70" stroke="#0b3d91" stroke-width="6"/>
    <line x1="-30" y1="-26" x2="-30" y2="70" stroke="#0b3d91" stroke-width="6"/>
    <line x1="30" y1="-26" x2="30" y2="70" stroke="#0b3d91" stroke-width="6"/>
    <line x1="90" y1="-26" x2="90" y2="70" stroke="#0b3d91" stroke-width="6"/>
    <g stroke="#97bedf" stroke-width="4" fill="none">
      <line x1="-160" y1="72" x2="160" y2="72"/>
      <line x1="-160" y1="40" x2="160" y2="40"/>
      <line x1="-160" y1="10" x2="160" y2="10"/>
    </g>
    <rect x="-30" y="0" width="60" height="48" fill="#e8f6ff" stroke="#cfeeff" stroke-width="2" rx="4"/>
    <line x1="0" y1="0" x2="0" y2="48" stroke="#cfeeff" stroke-width="2"/>
    <line x1="-30" y1="24" x2="30" y2="24" stroke="#cfeeff" stroke-width="2"/>
    <rect x="110" y="48" width="46" height="36" rx="6" fill="#ffdca2" stroke="#e6b878"/>
    <text x="133" y="72" font-family="Arial" font-size="12" fill="#4b3a2a" text-anchor="middle" alignment-baseline="middle">OBRA</text>
  </g>

  <!-- Small location reference (subtle) -->
  <text x="40" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2b5878" opacity="0.85">Ferreira do Zêzere · Dornes</text>

  <!-- Foreground shore accents -->
  <ellipse cx="140" cy="860" rx="260" ry="56" fill="#f6f3ee" opacity="1"/>
  <ellipse cx="1760" cy="860" rx="260" ry="56" fill="#f6f3ee" opacity="1"/>

  <!-- subtle vignette -->
  <rect x="0" y="0" width="100%" height="100%" fill="black" opacity="0.03"/>
</svg>